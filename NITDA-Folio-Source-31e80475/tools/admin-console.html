/* ============================================================
   Platform variant bindings (Tier 3 of the NITDA Portfolio Brand and Design System)
   Source: Portfolio package 1.0.0, tokens/portfolio.platforms.css, values unchanged.
   Loads AFTER the core token stack. Re-binds semantic/component intent only; redeclaring a
   --dgo-* primitive here is prohibited (package rule GOV-04).
   Usage: <html data-platform="nitda-web|dgo-ops|portal">

   In this repository (styles/dgo-design-system/README.md, exception RX-01):
     dgo-ops  binds Folio Workspace and the Folio tools. "dgo-ops" is the package's machine id;
              machine ids keep their dgo spelling (docs/reference/PLATFORM_NAMING.md).
     portal   binds the NITDA Document Portal.
     nitda-web is the agency's public website, which is not in this repository.
   ============================================================ */

:root {
  --pf-reading-family:   var(--dgo-family-body);
  --pf-content-max:      1200px;
  --pf-header-surface:   var(--dgo-color-surface-brand);
  --pf-header-fg:        var(--dgo-color-fg-on-brand);
  --pf-radius-surface:   var(--dgo-radius-card);
  --pf-motion-state:     var(--dgo-motion-state);
}

/* P1 · NITDA Public Web — institutional, long-form, comfortable */
[data-platform="nitda-web"] {
  --pf-reading-family:   var(--dgo-family-body);
  --pf-content-max:      1200px;
  --pf-header-surface:   var(--dgo-color-surface-brand);
  --pf-header-fg:        var(--dgo-color-fg-on-brand);
  --pf-radius-surface:   var(--dgo-radius-card);
}

/* P2 · Folio Workspace (the package names P2 for the DGO sub-brand; see RX-01) — data-dense, compact */
[data-platform="dgo-ops"] {
  --pf-reading-family:   var(--dgo-family-sans);
  --pf-content-max:      none;
  --pf-header-surface:   var(--dgo-color-surface-raised);
  --pf-header-fg:        var(--dgo-color-fg-default);
  --pf-radius-surface:   var(--dgo-radius-control);
}

/* P3 · NITDA Document Portal (package: NITDA Intelligent Portal) — citizen service */
[data-platform="portal"] {
  --pf-reading-family:   var(--dgo-family-sans);
  --pf-content-max:      1120px;
  --pf-header-surface:   var(--dgo-color-surface-brand);
  --pf-header-fg:        var(--dgo-color-fg-on-brand);
  --pf-radius-surface:   var(--dgo-radius-card);
}

/* ── End of brand tokens ── */

/* ============================================================================================
   Platform chrome and the DGO Digital Ops sub-brand.

   One file, two consumers: the runtime imports it into its `brand` layer (styles/index.css), and
   scripts/lib/brand-kit.mjs bundles it into every embedded and packaged copy of the kit. So the
   lockup and the header colours are defined once.

   THE BRAND ARCHITECTURE (styles/dgo-design-system/README.md)
     NITDA            the master brand; its logo is on every surface.
     DGO Digital Ops  the endorsed internal sub-brand: the Director-General's Office's operational
                      technology. Its lockup sits beside the NITDA logo on internal surfaces only.
     Folio …          product names inside DGO Digital Ops (Folio Workspace, Estate Console, …).
   External surfaces (the Document Portal, public email, letters to other institutions) carry
   NITDA alone. test:brand enforces both halves.

   HEADER COLOURS FOLLOW THE PLATFORM BINDING
   tokens.platforms.css (Portfolio package, Tier 3) gives each platform its header surface:
   Deep Green by default and for the portal, the raised surface for data-platform="dgo-ops".
   Everything drawn on a header reads --bk-hdr-*, so one attribute on <html> re-skins it.
   ============================================================================================ */

:root{
  --bk-hdr-bg:          var(--pf-header-surface, var(--dgo-color-surface-brand));
  --bk-hdr-fg:          var(--pf-header-fg, var(--dgo-color-fg-on-brand));
  --bk-hdr-muted:       var(--dgo-color-fg-on-brand-muted);
  --bk-hdr-soft:        var(--dgo-color-fg-on-brand-soft);
  --bk-hdr-line:        var(--dgo-color-border-on-brand-soft);
  --bk-hdr-veil:        var(--dgo-color-surface-on-brand-veil);
  --bk-hdr-veil-strong: color-mix(in srgb, var(--dgo-color-fg-on-brand) 20%, transparent);
  --bk-hdr-mark:        var(--dgo-color-fg-on-brand);   /* the DGO letters and the O's centre */
  --bk-hdr-accent:      var(--dgo-smart-400);
}
[data-platform="dgo-ops"]{
  --bk-hdr-muted:       var(--dgo-color-fg-muted);
  --bk-hdr-soft:        var(--dgo-color-fg-muted);
  --bk-hdr-line:        var(--dgo-color-border-default);
  --bk-hdr-veil:        color-mix(in srgb, var(--dgo-color-fg-default) 5%, var(--dgo-color-surface-raised));
  --bk-hdr-veil-strong: color-mix(in srgb, var(--dgo-color-fg-default) 10%, var(--dgo-color-surface-raised));
  --bk-hdr-mark:        var(--dgo-color-fg-brand);
}

/* ── NITDA logo on a header: the white lockup on a dark bar, the colour lockup on a light one.
   Deliberately not :where(): a page's own img rules must not bring both back. ─────────────── */
.bk-logo--on-light{ display: none !important; }
:root[data-platform="dgo-ops"]:not([data-theme="dark"]) .bk-logo--on-light{ display: block !important; }
:root[data-platform="dgo-ops"]:not([data-theme="dark"]) .bk-logo--on-dark{ display: none !important; }
@media (prefers-color-scheme: dark){
  :root[data-platform="dgo-ops"]:not([data-theme="light"]) .bk-logo--on-light{ display: none !important; }
  :root[data-platform="dgo-ops"]:not([data-theme="light"]) .bk-logo--on-dark{ display: block !important; }
}

/* ── The DGO Digital Ops lockup ────────────────────────────────────────────────────────────
   "DG" set in the display face, the O drawn as the atomic-orbit mark (a Smart Green ring round a
   centre dot), then DIGITAL / OPS stacked in small caps behind a Smart Green rule. Built from
   text and geometry, never from a picture of text, so it is crisp at any size and cannot clip
   when a face is missing. Letters and dot take --bk-sub-ink (Deep Green on light, white on dark);
   the ring is always Smart Green. Markup: scripts/lib/brand-kit.mjs subLockup(). */
.bk-sub{
  --bk-sub-ink: var(--bk-hdr-mark, var(--dgo-color-fg-brand));
  display: inline-flex; align-items: center; gap: .55em;
  color: var(--bk-sub-ink); line-height: 1; white-space: nowrap; text-decoration: none;
  font-size: 16px;
}
.bk-sub__word{
  display: inline-flex; align-items: center;
  font: 800 1.55em/1 var(--dgo-family-display); letter-spacing: -.035em;
}
.bk-sub__o{ width: .84em; height: .84em; margin-left: .05em; flex: none; overflow: visible; }
.bk-sub__o .ring{ fill: none; stroke: var(--dgo-smart-400); stroke-width: 5.5; }
.bk-sub__o .dot{ fill: currentColor; }
.bk-sub__name{
  display: grid; gap: .12em;
  padding-left: .6em; border-left: 1.5px solid var(--dgo-smart-400);
  font: 700 .56em/1.05 var(--dgo-family-display); letter-spacing: .18em; text-transform: uppercase;
}
.bk-sub__endorse{
  display: block; margin-top: .35em;
  font: 600 .44em/1 var(--dgo-family-sans); letter-spacing: .16em; text-transform: uppercase; opacity: .8;
}
.bk-sub__endorse::before{ content: ""; display: inline-block; width: .6em; height: .6em; margin-right: .5em; border-radius: 50%; background: var(--dgo-smart-400); vertical-align: -.05em; }
.bk-sub--mark-only .bk-sub__name{ display: none; }
.bk-sub--lg{ font-size: 22px; }
.bk-sub--sm{ font-size: 13px; }
.bk-sub--reverse{ --bk-sub-ink: var(--dgo-color-fg-on-brand); }
.bk-sub--brand{ --bk-sub-ink: var(--dgo-color-fg-brand); }
.bk-sub .bk-sub__sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (forced-colors: active){
  .bk-sub__o .ring{ stroke: CanvasText; }
  .bk-sub__name{ border-left-color: CanvasText; }
}

:root{color-scheme:light dark;
 --bg:var(--dgo-color-surface-sunken);--card:var(--dgo-color-surface-raised);
 --ink:var(--dgo-color-fg-default);--ink2:var(--dgo-color-fg-muted);--ink3:var(--dgo-color-fg-subtle);
 --line:var(--dgo-color-border-default);
 --brand:var(--dgo-color-action-primary);--on-brand:var(--dgo-color-fg-on-brand);--brand-fg:var(--dgo-color-fg-brand);
 --ok:var(--dgo-color-success-subtle-fg);--okbg:var(--dgo-color-success-subtle-bg);
 --warn:var(--dgo-color-warning-subtle-fg);--warnbg:var(--dgo-color-warning-subtle-bg);
 --bad:var(--dgo-color-danger-subtle-fg);--badbg:var(--dgo-color-danger-subtle-bg);
 --bad-solid:var(--dgo-color-danger-strong-bg);--on-bad:var(--dgo-color-danger-strong-fg);
 --info:var(--dgo-color-info-subtle-fg);--infobg:var(--dgo-color-info-subtle-bg);
 --mono:var(--dgo-family-mono);
 --sans:var(--dgo-family-sans)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
/* The light DGO Digital Ops header of an internal tool: colours from the platform binding. */
header.top{background:var(--bk-hdr-bg);color:var(--bk-hdr-fg);padding:14px 20px 16px;border-bottom:1px solid var(--bk-hdr-line)}
header.top .brandrow{display:flex;align-items:center;gap:14px;margin-bottom:12px}
header.top .brandrow img{width:128px;height:auto}
header.top .bk-sub{font-size:14px;padding-left:14px;border-left:1px solid var(--bk-hdr-line)}
header.top h1{margin:0;font-size:19px;letter-spacing:-.01em}
header.top p{margin:6px 0 0;color:var(--bk-hdr-muted);font-size:13px;max-width:80ch}
.wrap{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-size:22px;margin-top:4px;font-weight:650}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}
nav.tabs button{font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;
 border:1px solid var(--line);background:var(--card);color:var(--ink2)}
nav.tabs button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
section.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px}
section.panel h2{margin:0 0 4px;font-size:16px}
section.panel h3{margin:14px 0 6px;font-size:14px}
.muted{color:var(--ink2);font-size:13px}
.tiny{color:var(--ink3);font-size:12px}
code,.mono{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:650;
 border:1px solid var(--line);background:var(--bg);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.info{background:var(--infobg);color:var(--info);border-color:transparent}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:650}
tr[data-key]{cursor:pointer}tr[data-key]:hover td{background:var(--bg)}
input[type=text],input[type=search],textarea{font:inherit;font-size:13px;width:100%;padding:8px 10px;
 border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{font-family:var(--mono);min-height:120px;resize:vertical}
button.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;
 border:1px solid var(--brand);background:var(--brand);color:var(--on-brand)}
button.btn.ghost{background:transparent;color:var(--brand-fg);border-color:var(--brand-fg)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;margin-top:10px}
.finding{border-left:3px solid var(--line);padding-left:12px;margin:14px 0}
.finding.error{border-color:var(--bad)}.finding.warn{border-color:var(--warn)}.finding.info{border-color:var(--info)}
.note{background:var(--warnbg);border:1px solid transparent;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px;color:var(--warn)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink3);font-size:13px}
.drop.over{border-color:var(--brand-fg);color:var(--brand-fg)}
ul.plain{margin:8px 0;padding-left:20px}ul.plain li{margin:3px 0;font-size:13px}
ol.plain li{margin:3px 0;font-size:13px}
section.panel p,section.panel li{overflow-wrap:anywhere}
@media print{nav.tabs,button{display:none}body{background:var(--dgo-color-surface-page)}section.panel{break-inside:avoid}}
.kpi.good b{color:var(--ok)}.kpi.bad b{color:var(--bad)}
section.panel.good{border-color:var(--ok)}section.panel.danger{border-color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 6px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.issue{border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:12px 14px}
.issue.bad{border-left-color:var(--bad)}.issue.warn{border-left-color:var(--warn)}.issue.good{border-left-color:var(--ok)}
.issue p{margin:4px 0}
.flowhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.progress{position:relative;height:26px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin:14px 0;overflow:hidden}
.progress .bar{position:absolute;inset:0 auto 0 0;background:var(--ok);opacity:.25;transition:width .3s}
.progress span{position:relative;display:block;text-align:center;line-height:24px;font-size:12px;font-weight:650;color:var(--ink2)}
.chip{font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink2);margin-right:6px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:650}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--ink)}th.sortable.on{color:var(--brand-fg)}
tr[data-key],tr[data-wf]{cursor:pointer}
.tiny-btn{padding:3px 9px;font-size:11px}
input.bad{border-color:var(--bad)}
.check{display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-size:13px;color:var(--ink2)}
.check input{margin-top:3px;flex:none}
.note.bad{background:var(--badbg);color:var(--bad)}
p.bad{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);opacity:0;transition:.25s;
 background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;max-width:90vw;text-align:center}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad-solid);color:var(--on-bad)}
@media(max-width:640px){.wrap{padding:14px 12px 50px}header.top{padding:14px 12px}.kpi b{font-size:18px}}</style>
</head><body>

  const claimable = new Set(atlas.keys.map((k) => k.key));
  const impostors = atlas.workflows
    .filter((w) => !w.bound && w.names.some((n) => claimable.has(n)))
    .map((w) => ({
      workflowId: w.workflowId,
      claims: w.names.filter((n) => claimable.has(n)),
      name: w.names[0],
      live: w.hasEndpoint,
      servedInsteadBy: w.names.filter((n) => claimable.has(n))
        .map((n) => atlas.keys.find((k) => k.key === n)?.workflowId)
        .filter(Boolean),
    }));
  if (impostors.length) {
    const live = impostors.filter((i) => i.live);
    out.push({
      code: 'estate.name-collision',
      severity: live.length ? 'error' : 'warn',
      title: `${impostors.length} workflow(s) carry a contract-key name but serve no key`,
      detail: `${live.length} of them still answer on a live endpoint. Wiring a key by flow NAME `
        + 'instead of by workflow id gives a valid, working URL that calls a flow the estate no '
        + 'longer uses — and every automated check passes, because the URL is well formed.',
      items: impostors,
    });
  }

  /* 2. Keys the platform's own contract table does not know.
        `EndpointKeys` drives diagnostics' "Endpoints configured n/n". A key absent from it is
        absent from that count, so the check can read green while the key is unconfigured. */
  const uncontracted = rows.filter((r) => r.surface === 'internal' && !r.inContractTable);
  if (uncontracted.length) {
    out.push({
      code: 'estate.no-contract',
      severity: 'warn',
      title: `${uncontracted.length} internal key(s) have no entry in the contract table`,
      detail: 'config/endpoints.config.js drives the System Health count of configured endpoints. '
        + 'A key missing from it is not counted there, so that check can read green while the key '
        + 'is unconfigured and its feature is dead.',
      items: uncontracted.map((r) => ({ key: r.key, configured: r.configured })),
    });
  }

  /* 3. Contract keys with no place in the estate. The mirror of 2: the build knows how to call
        something the tenant has no record of. */
  const known = new Set(atlas.keys.map((k) => k.key));
  const orphanContracts = EndpointKeys.filter((k) => !known.has(k));
  if (orphanContracts.length) {
    out.push({
      code: 'estate.orphan-contract',
      severity: 'info',
      title: `${orphanContracts.length} contract key(s) are not in the register`,
      detail: 'This build can call them, but the tenant register does not list them as endpoints. '
        + 'They resolve through another key\'s URL — check each contract\'s sourceKey before '
        + 'assuming a missing flow.',
      items: orphanContracts.map((k) => ({ key: k, sourceKey: EndpointContracts[k]?.sourceKey || null })),
    });
  }

  /* 4. Keys calling a flow other than the one the register names. Silent by construction. */
  const wrong = rows.filter((r) => r.status === 'wrong-flow');
  if (wrong.length) {
    out.push({
      code: 'estate.wrong-flow',
      severity: 'error',
      title: `${wrong.length} key(s) call a workflow the register does not name for them`,
      detail: 'These do not fail. They succeed against the wrong flow, which is worse.',
      items: wrong.map((r) => ({ key: r.key, expected: r.expected?.workflowId, actual: r.actualWorkflow })),
    });
  }

  /* 5. Signature defects, grouped — one row per condition rather than one per key, so a
        half-finished values file reads as one job rather than twenty problems. */
  const sigProblems = rows.filter((r) => ['no-signature', 'bad-signature'].includes(r.status));
  if (sigProblems.length) {
    out.push({
      code: 'estate.signature',
      severity: 'error',
      title: `${sigProblems.length} key(s) have no usable signature`,
      detail: `A signature is ${SIGNATURE_LENGTH} characters. Complete them with `
        + 'npm run values:sign, then npm run setup -- --values <file> --force.',
      items: sigProblems.map((r) => ({ key: r.key, length: r.signatureLength })),
    });
  }

  /* 6. Unconfigured keys, by surface. Stated as a count of features that are off rather than
        as an error, because leaving a feature unconfigured is a legitimate posture. */
  const unconfigured = rows.filter((r) => r.status === 'unconfigured');
  if (unconfigured.length) {
    out.push({
      code: 'estate.unconfigured',
      severity: 'warn',
      title: `${unconfigured.length} key(s) are not configured in this deployment`,
      detail: 'Each reports itself unavailable at the moment of use rather than failing mid-action. '
        + 'That is correct behaviour for a feature you have chosen not to switch on.',
      items: unconfigured.map((r) => ({ key: r.key, surface: r.surface })),
    });
  }

  return out;
}

/** Headline counts for the console's summary strip. */
function summarise({ resolve, atlas = EndpointAtlas } = {}) {
  const rows = describeEstate({ resolve, atlas });
  const f = findings({ resolve, atlas });
  return {
    keys: rows.length,
    configured: rows.filter((r) => r.configured).length,
    healthy: rows.filter((r) => r.healthy).length,
    signed: rows.filter((r) => r.signatureLength === SIGNATURE_LENGTH).length,
    internal: rows.filter((r) => r.surface === 'internal').length,
    portal: rows.filter((r) => r.surface === 'portal').length,
    workflows: atlas.workflows.length,
    workflowsBound: atlas.totals.workflowsBound,
    workflowsLive: atlas.totals.workflowsWithEndpoint,
    errors: f.filter((x) => x.severity === 'error').length,
    warnings: f.filter((x) => x.severity === 'warn').length,
  };
}

/**
 * The report an administrator hands to someone else.
 *
 * Redacted by construction: it is built from `describeKey`, which resolves the URL only to
 * redact it, and no field here carries the raw value. That is asserted in the test suite on
 * the serialised output, not just on the fields, because the guarantee people rely on is
 * "nothing in this JSON is a credential" and that is a property of the whole string.
 */
function exportReport({ resolve, atlas = EndpointAtlas, generatedAt = new Date().toISOString() } = {}) {
  return {
    schema: 'dgo-endpoint-console-report/v1',
    generatedAt,
    authority: atlas.authority,
    note: 'Redacted. Every signature is replaced with *** — this file is safe to send to support.',
    summary: summarise({ resolve, atlas }),
    findings: findings({ resolve, atlas }),
    keys: describeEstate({ resolve, atlas }).map((r) => ({
      key: r.key,
      surface: r.surface,
      flow: r.expected?.flow ?? null,
      expectedWorkflow: r.expected?.workflowId ?? null,
      actualWorkflow: r.actualWorkflow || null,
      method: r.expected?.method ?? null,
      configured: r.configured,
      signatureLength: r.signatureLength,
      sharesFlowWith: r.sharesFlowWith,
      status: r.status,
      target: r.target,
      problems: r.problems.map((p) => p.code),
    })),
    workflows: atlas.workflows,
  };
}

const EndpointAtlasView = Object.freeze({
  describeKey, describeEstate, findings, summarise, exportReport,
  workflowIdOf, signatureLengthOf, SIGNATURE_LENGTH, SEVERITY, atlas: EndpointAtlas,
});

/* The standalone administrative console's interface.
 *
 * Inlined verbatim into tools/admin-console.html by scripts/build-admin-console.mjs, after the
 * estate data and the shared analysis from core/endpoint-atlas.js. It is a plain script, not a
 * module: the console is one <script> in one file, and it must run from file:// where module
 * loading and fetch are both restricted.
 *
 * IT COMMISSIONS. It does not merely report.
 *
 * The first version of this console was read-only, and that was a decision nobody asked for. An
 * administrator holding it could see that SUBMISSION had no signature and could do nothing about
 * it without a checkout, Node, and a terminal — which is exactly the situation the standalone
 * tool exists to serve. So the Commission tab takes the signatures, validates each against the
 * register as it is typed, and writes both config.local.js files, byte-identical to what
 * `npm run setup` emits. That is the whole job, done from one file.
 *
 * The constraint that is real, and kept: nothing is persisted and nothing is transmitted. A
 * signature lives in a variable until the tab closes. Generating a file the operator downloads is
 * not storage — it is the deliverable.
 */

/* eslint-disable no-var */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pill = (t, k = '') => '<span class="pill ' + k + '">' + esc(t) + '</span>';

/**
 * Everything the session holds. In memory, for the life of the tab.
 *
 * `urls` is the working set the whole console reasons about — loaded from a file, typed into the
 * Commission tab, or both. `baseline` is a second set held only for the Compare tab. Neither is
 * written to storage of any kind: this file gets opened on machines nobody controls, and a
 * signature in a browser profile outlives the tab, the session, and the person's memory of having
 * pasted it.
 */
let S = {
  urls: {},           // KEY -> full URL, as supplied
  sourceName: '',
  baseline: null,     // { urls, name } for Compare
  probe: null,
  rotated: {},        // KEY -> true, the rotation tracker's ticks
  busy: false,
  verify: null,       // the last tenant export checked on the Work status tab
};

const resolve = (key) => S.urls[key] || '';
const loadedCount = () => Object.values(S.urls).filter(Boolean).length;

const view = {
  tab: 'overview', surface: 'all', status: 'all', q: '', estateFilter: 'all',
  selected: null, sortKey: 'status', sortDir: 1, wf: null, includeWrites: false, workFilter: 'all',
};

const STATUS_LABEL = { ok: 'healthy', unconfigured: 'not configured', 'wrong-flow': 'WRONG FLOW',
  'no-signature': 'no signature', 'bad-signature': 'bad signature', 'not-https': 'not HTTPS',
  placeholder: 'placeholder', 'no-contract': 'no contract' };
const STATUS_KIND = { ok: 'ok', unconfigured: '', 'wrong-flow': 'bad', 'no-signature': 'bad',
  'bad-signature': 'bad', 'not-https': 'bad', placeholder: 'warn', 'no-contract': 'warn' };
const SEV_KIND = { error: 'bad', warn: 'warn', info: 'info' };

/* ── shared helpers ───────────────────────────────────────────────────────────────────── */

/** A redacted URL is still ~200 characters. Rows must be readable; the full value is in detail. */
function compactTarget(url) {
  if (!url) return '<span class="tiny">—</span>';
  const seg = (url.match(/\/cu\/(\d+)\//) || [])[1];
  const sig = /sig=\*\*\*/.test(url) ? 'sig=***' : /sig=/.test(url) ? 'sig=' : 'no sig';
  return '<code>' + (seg ? 'cu/' + esc(seg) + ' · ' : '') + '…/invoke?' + esc(sig) + '</code>';
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); toast(what + ' copied.'); }
  catch { toast('Could not copy — use Download instead.', 'bad'); }
}

function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('in'), 10);
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 300); }, 3200);
}

const sigLen = (url) => { const m = /[?&]sig=([A-Za-z0-9_%-]*)/i.exec(url || ''); return m ? decodeURIComponent(m[1]).length : null; };
const keysOf = (surface) => EndpointAtlas.keys.filter((k) => !surface || k.surface === surface);

/* ── input parsing ────────────────────────────────────────────────────────────────────── */

function parseValues(text) {
  const out = {};
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    const m = /^(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/.exec(line);
    if (!m) continue;
    out[m[1].replace(/^(DGO|PF)_ENDPOINT_/, '')] = m[2].trim().replace(/^(['"])(.*)\1$/, '$2');
  }
  return out;
}

/** Read by pattern, never evaluated. Running a file someone handed you is not a thing a tool does. */
function parseConfigLocal(text) {
  const out = {};
  for (const m of String(text).matchAll(/^\s*([A-Z][A-Z0-9_]*)\s*:\s*(["'])([^"']*)\2/gm)) {
    if (m[3]) out[m[1]] = m[3];
  }
  return out;
}

function readAny(text) {
  const looksConfig = /DGO_CONFIG|PF_CONFIG/.test(text);
  return { urls: looksConfig ? parseConfigLocal(text) : parseValues(text), kind: looksConfig ? 'config.local.js' : 'values file' };
}

function load(text, name, asBaseline) {
  const { urls, kind } = readAny(text);
  const n = Object.values(urls).filter(Boolean).length;
  if (!n) { toast('No endpoint values found in ' + name + '.', 'bad'); return; }
  if (asBaseline) { S.baseline = { urls, name: name + ' (' + kind + ')' }; view.tab = 'compare'; }
  else { S.urls = Object.assign({}, S.urls, urls); S.sourceName = name + ' (' + kind + ')'; S.probe = null; view.tab = 'endpoints'; }
  toast(n + ' value(s) read from ' + name + '. Nothing was uploaded.');
  render();
}

/* ── config generation — byte-identical to `npm run setup` ────────────────────────────── */

const pad = (s, w) => String(s) + ' '.repeat(Math.max(0, w - String(s).length));

function renderRuntimeConfig(values) {
  const keys = keysOf('internal').map((k) => k.key);
  const w = Math.max(...keys.map((k) => k.length)) + 2;
  const lines = keys.map((k) => '    ' + pad(k + ':', w) + JSON.stringify(values[k] || '') + ',');
  return [
    '/* DGO R11.6 runtime — endpoint configuration.',
    ' *',
    ' * WRITTEN BY the standalone administrative console (tools/admin-console.html).',
    ' * Identical in form to what `npm run setup` emits. Git-ignored on purpose: every URL below',
    ' * is a signed Power Automate trigger, and a signed trigger URL is a bearer credential —',
    ' * possession alone authorises invoking the flow.',
    ' *',
    ' * This file is delivered verbatim to every browser that loads the platform, so treat each URL',
    ' * as public from the moment you deploy. There is no proxy in the request path: the flow behind',
    ' * each URL is the only place authentication, authorisation, validation and rate limiting can',
    ' * happen, and it must do all four itself.',
    ' *',
    ' * Rotate on a schedule: regenerate the signature in Power Automate, rebuild this file,',
    ' * redeploy. That is the only way to revoke one.',
    ' *',
    ' * An empty value is not a failure — that endpoint\'s feature reports itself unconfigured',
    ' * rather than pretending an action succeeded.',
    ' *',
    ' * MERGED, NOT ASSIGNED, so an injected window.DGO_CONFIG still wins.',
    ' */',
    'window.DGO_CONFIG = window.DGO_CONFIG || {};',
    'window.DGO_CONFIG.endpoints = Object.assign({',
    lines.join('\n'),
    '}, window.DGO_CONFIG.endpoints);',
    '',
  ].join('\n');
}

function renderPortalConfig(values) {
  const keys = keysOf('portal').map((k) => k.key);
  const w = Math.max(...keys.map((k) => k.length)) + 2;
  const lines = keys.map((k) => '    ' + pad(k + ':', w) + JSON.stringify(values[k] || '') + ',');
  return [
    '/* Document portal — endpoint configuration.',
    ' *',
    ' * WRITTEN BY the standalone administrative console (tools/admin-console.html).',
    ' * Identical in form to what `npm run setup` emits. Git-ignored on purpose.',
    ' *',
    ' * ⚠  This is the PUBLIC portal. Every URL below is readable by anyone who fetches a static',
    ' * asset from the site, so configure only endpoints whose flows are built to be invoked by an',
    ' * anonymous stranger: each must validate its own input, rate-limit its own callers, return',
    ' * only what that caller is entitled to see, and be rotatable.',
    ' *',
    ' * Leave SUBMISSION empty and the portal stays in DEMO MODE — everything stays on the device',
    ' * and nothing is transmitted, which is the safe failure for a public channel.',
    ' *',
    ' * MERGED, NOT ASSIGNED, so an injected window.PF_CONFIG still wins.',
    ' */',
    'window.PF_CONFIG = window.PF_CONFIG || {};',
    'window.PF_CONFIG.endpoints = Object.assign({',
    lines.join('\n'),
    '}, window.PF_CONFIG.endpoints);',
    '',
  ].join('\n');
}

function valuesFileText(values) {
  const out = ['# DGO endpoint values. Add the 43-character signature after each "sig=".',
    '# Generated by the standalone administrative console. Never commit this file.', ''];
  for (const surface of ['internal', 'portal']) {
    out.push('# ' + '='.repeat(72), '# ' + surface.toUpperCase(), '# ' + '='.repeat(72));
    let last = null;
    for (const k of keysOf(surface)) {
      if (k.workflowId !== last) {
        last = k.workflowId;
        const peers = EndpointAtlas.keys.filter((x) => x.workflowId === k.workflowId).map((x) => x.key);
        out.push('', '# ' + k.flow + '  ·  workflow ' + k.workflowId
          + (peers.length > 1 ? '  ·  ' + peers.length + ' keys, ONE url' : ''));
      }
      out.push((surface === 'portal' ? 'PF_ENDPOINT_' : 'DGO_ENDPOINT_') + k.key + '='
        + (values && values[k.key] ? values[k.key] : k.urlTemplate));
    }
    out.push('');
  }
  return out.join('\n');
}

/* ── commissioning readiness, computed here ───────────────────────────────────────────── */

/**
 * The gate `npm run commission` applies, evaluated in the browser.
 *
 * PILOT is the honest posture for this estate and the one the gate infers, so the required set is
 * the minimal-pilot subset — the endpoints without which correspondence cannot flow end to end.
 * Everything else is a feature you may legitimately leave off, and reporting an unconfigured
 * feature as a blocker would train people to ignore blockers.
 */
const PILOT_KEYS = ['FETCH_ALL', 'DYNAMIC_ACTIONS', 'SINGLE_ASSIGNMENT', 'BULK_ASSIGNMENT', 'SUBMISSION', 'UPLOAD'];

function readiness() {
  const rows = describeEstate({ resolve });
  const byKey = Object.fromEntries(rows.map((r) => [r.key, r]));
  const blockers = [];
  const warnings = [];

  const missingPilot = PILOT_KEYS.filter((k) => !byKey[k] || !byKey[k].configured);
  if (missingPilot.length) {
    blockers.push({ title: missingPilot.length + ' required endpoint(s) unwired',
      detail: 'Correspondence cannot flow end to end without: ' + missingPilot.join(', ') + '.',
      fix: 'Commission tab — paste each signature, then generate the config files.' });
  }
  const wrong = rows.filter((r) => r.status === 'wrong-flow');
  if (wrong.length) {
    blockers.push({ title: wrong.length + ' key(s) call the wrong workflow',
      detail: wrong.map((r) => r.key).join(', ') + ' — the URL is valid, so nothing fails. It succeeds against the wrong flow.',
      fix: 'Commission tab — the affected keys are marked; re-copy from the flow the register names.' });
  }
  const badSig = rows.filter((r) => ['no-signature', 'bad-signature'].includes(r.status));
  if (badSig.length) {
    blockers.push({ title: badSig.length + ' key(s) have no usable signature',
      detail: badSig.map((r) => r.key + ' (' + (r.signatureLength === null ? 'absent' : r.signatureLength + ' chars') + ')').join(', '),
      fix: 'A signature is exactly ' + SIGNATURE_LENGTH + ' characters.' });
  }
  const notHttps = rows.filter((r) => r.status === 'not-https');
  if (notHttps.length) blockers.push({ title: notHttps.length + ' key(s) are not HTTPS', detail: notHttps.map((r) => r.key).join(', '), fix: 'Re-copy the URL.' });

  const off = rows.filter((r) => r.status === 'unconfigured' && !PILOT_KEYS.includes(r.key));
  if (off.length) warnings.push({ title: off.length + ' optional feature(s) are not configured', detail: off.map((r) => r.key).join(', ') + ' — each reports itself unavailable rather than failing mid-action.' });
  const collisions = EndpointAtlas.workflows.filter((w) => !w.bound && w.hasEndpoint && w.names.some((n) => EndpointAtlas.keys.some((k) => k.key === n)));
  if (collisions.length) warnings.push({ title: collisions.length + ' live workflow(s) impersonate a contract key', detail: 'Wiring by flow name instead of workflow id gives a working URL to a retired flow. See Findings.' });

  return { blockers, warnings, rows, cleared: blockers.length === 0 && loadedCount() > 0 };
}

/* ── panels ───────────────────────────────────────────────────────────────────────────── */

const kpi = (l, v, k) => '<div class="kpi ' + (k || '') + '"><small>' + l + '</small><b>' + esc(v) + '</b></div>';

function summaryStrip() {
  const s = summarise({ resolve });
  const r = readiness();
  return '<div class="kpis">'
    + kpi('Contract keys', EndpointAtlas.keys.length)
    + kpi('Configured', loadedCount() ? s.configured + '/' + s.keys : '—')
    + kpi('Healthy', loadedCount() ? s.healthy + '/' + s.keys : '—')
    + kpi('Tenant workflows', s.workflowsBound + '/' + s.workflows + ' in use')
    + kpi('Readiness', loadedCount() ? (r.cleared ? 'CLEARED' : r.blockers.length + ' blocker' + (r.blockers.length === 1 ? '' : 's')) : 'nothing loaded',
        loadedCount() ? (r.cleared ? 'good' : 'bad') : '')
    + '</div>';
}

function overviewPanel() {
  const r = readiness();
  const s = summarise({ resolve });
  if (!loadedCount()) {
    return '<section class="panel"><h2>Start here</h2>'
      + '<p class="muted">This console administers the whole endpoint estate — all ' + EndpointAtlas.keys.length
      + ' contract keys across the internal platform and the public portal, and all ' + EndpointAtlas.workflows.length
      + ' workflows in the tenant. It runs entirely in this page.</p>'
      + '<div class="cards">'
      + card('Commission from scratch', 'Paste ' + EndpointAtlas.keys.length + ' signatures and generate both config.local.js files. No checkout, no Node.', 'commission', 'Open the workspace')
      + card('Inspect a deployment', 'Load a values file or a config.local.js and see exactly what it will call.', null, 'Load a file', 'data-pick')
      + card('Work status', WorkStatus.packages.filter((p) => p.action !== 'in-tenant').length + ' package(s) to paste or re-paste, ' + WorkStatus.register.open.length + ' register item(s) open.', 'work', 'Open work status')
      + card('Explore the estate', 'All ' + EndpointAtlas.workflows.length + ' tenant workflows, including the ' + (s.workflows - s.workflowsBound) + ' this system does not call.', 'estate', 'Open the estate')
      + '</div>'
      + dropZone()
      + '</section>' + findingsPanel(true);
  }
  return '<section class="panel ' + (r.cleared ? 'good' : 'danger') + '">'
    + '<h2>' + (r.cleared ? 'Cleared for pilot usage' : r.blockers.length + ' blocker' + (r.blockers.length === 1 ? '' : 's')) + '</h2>'
    + '<p class="muted">From <b>' + esc(S.sourceName || 'values entered here') + '</b>. '
    + (r.cleared ? 'Every required endpoint is wired, well-formed, and points at the workflow the tenant register names for it.'
      : 'Correspondence cannot flow end to end until these are resolved.') + '</p>'
    + (r.blockers.length ? '<div class="stack">' + r.blockers.map((b) =>
        '<div class="issue bad"><b>' + esc(b.title) + '</b><p class="muted">' + esc(b.detail) + '</p><p class="tiny">' + esc(b.fix) + '</p></div>').join('') + '</div>' : '')
    + (r.warnings.length ? '<h3>Worth knowing</h3><div class="stack">' + r.warnings.map((w) =>
        '<div class="issue warn"><b>' + esc(w.title) + '</b><p class="muted">' + esc(w.detail) + '</p></div>').join('') + '</div>' : '')
    + '<div class="row"><button class="btn" data-tab="commission">Open the commissioning workspace</button>'
    + '<button class="btn ghost" data-tab="export">Generate config files</button>'
    + '<button class="btn ghost" data-unload>Unload</button></div>'
    + '</section>';
}

const card = (title, body, tab, action, attr) =>
  '<div class="card"><h3>' + esc(title) + '</h3><p class="muted">' + esc(body) + '</p>'
  + '<button class="btn ghost" ' + (tab ? 'data-tab="' + tab + '"' : (attr || '')) + '>' + esc(action) + '</button></div>';

const dropZone = () => '<div class="drop" data-drop>Drop a values file or a <code>config.local.js</code> here — '
  + '<button class="btn ghost" data-pick>choose one</button> — '
  + '<button class="btn ghost" data-paste-toggle>or paste</button>'

function commissionRow(g) {
  const cur = resolve(g.keys[0].key);

  return '<div class="issue ' + (wrong ? 'bad' : ok ? 'good' : '') + '" data-flow="' + esc(g.workflowId) + '">'
    + '<div class="flowhead"><b>' + esc(g.flow) + '</b> ' + pill(g.method || 'POST') + ' ' + pill(esc(g.seg || 'routing ?'))

    + '<div class="row"><input type="text" data-sig="' + esc(g.workflowId) + '" spellcheck="false" autocomplete="off"'
    + ' placeholder="Paste the signature (43 characters) or the whole trigger URL"'

    + '</div>';
}

/** Accepts a bare signature or a whole URL; splices it onto every key sharing that workflow. */
function applySignature(workflowId, raw) {
  const text = String(raw || '').trim();
  if (!text) { for (const k of EndpointAtlas.keys.filter((x) => x.workflowId === workflowId)) delete S.urls[k.key]; return { ok: true, cleared: true }; }
  let sig = text;
  const fromUrl = /[?&]sig=([A-Za-z0-9_%-]+)/i.exec(text);
  if (fromUrl) sig = decodeURIComponent(fromUrl[1]);
  else if (/^sig=/i.test(sig)) sig = sig.slice(4);
  sig = sig.trim();
  if (!/^[A-Za-z0-9_-]+$/.test(sig)) return { ok: false, why: 'that is not a signature — it contains characters a signature cannot contain' };
  if (sig.length !== SIGNATURE_LENGTH) return { ok: false, why: sig.length + ' characters, expected ' + SIGNATURE_LENGTH + (sig.length < SIGNATURE_LENGTH ? ' — the copy was cut short' : ' — something was copied with it') };
  /* If a whole URL was pasted, honour ITS workflow id: pasting the wrong flow's URL is exactly
     the mistake the wrong-flow finding exists to catch, and silently rewriting it onto the
     register's id would hide it. */
  const pastedWf = (/\/workflows\/([0-9a-f]{32})\b/i.exec(text) || [])[1];
  for (const k of EndpointAtlas.keys.filter((x) => x.workflowId === workflowId)) {
    let base = k.urlTemplate;
    if (pastedWf && pastedWf.toLowerCase() !== workflowId) base = base.replace(/\/workflows\/[0-9a-f]{32}/i, '/workflows/' + pastedWf.toLowerCase());
    S.urls[k.key] = base + sig;
  }
  return { ok: true };
}

    groups.push({ workflowId: k.workflowId, flow: k.flow, keys: EndpointAtlas.keys.filter((x) => x.workflowId === k.workflowId) });
  }
  const done = groups.filter((g) => S.rotated[g.workflowId]).length;
  return '<section class="panel"><h2>Rotation plan</h2>'
    + '<p class="muted">Rotation is <b>per flow</b>, not per key: regenerating one trigger invalidates every key on it at once. '
    + groups.length + ' flows serve the ' + EndpointAtlas.keys.length + ' keys, and ' + groups.filter((g) => g.keys.length > 1).length
    + ' of them serve more than one — those keys must be re-signed together or the ones you miss will 401.</p>'
    + '<div class="note">Order matters at the end, not the start: do not treat an old signature as revoked until the new one is confirmed working. Regenerating replaces it, so the sequence is regenerate → sign here → generate configs → deploy → verify.</div>'
    + '<div class="progress"><div class="bar" style="width:' + Math.round(done / groups.length * 100) + '%"></div><span>' + done + ' of ' + groups.length + ' flows marked rotated</span></div>'
    + '<div class="tablewrap"><table><thead><tr><th>Done</th><th>Flow</th><th>Workflow id</th><th>Keys invalidated together</th><th>Signed here</th></tr></thead><tbody>'
    + groups.map((g) => {

/* ── probe ────────────────────────────────────────────────────────────────────────────── */

/**
 * The request a key actually receives, which is not the same request for every key.
 *
 * Twenty-three keys take a POST of a JSON envelope. Two — SCAN_INTAKE and portal UPLOAD —
 * take a PUT of raw document bytes with the filename, size and SHA-256 in headers; that is
 * the whole reason they exist, since base64-in-JSON is what imposed the 4 MB ceiling they
 * replaced. Neither has an `EndpointContracts` entry, by design.
 *
 * A single POST-a-JSON-body probe therefore did not merely mislabel those two, it mis-called
 * them: Power Automate refuses a POST to a PUT-only trigger before the flow runs, so both
 * reported as broken while being correctly wired. The verb comes from the atlas, which the
 * reconciler derives from the caller's own transport declaration, so this console and
 * `npm run verify:endpoints` send the same shape.
 */
async function probeRequest(t) {
  const method = (t.expected && t.expected.method) || (t.contract && t.contract.method) || 'POST';
  if (method === 'PUT') {
    const body = new TextEncoder().encode('__DGO_CONSOLE_PROBE__\n');
    /* The deposit flows read all three headers. The digest is computed rather than omitted or
       faked: a flow that verifies it would reject a probe carrying neither, and the point of
       the probe is to distinguish "wired wrongly" from "refused the payload". */
    const headers = {
      'content-type': 'application/octet-stream',
      'x-dgo-filename': '__DGO_CONSOLE_PROBE__.bin',
      'x-dgo-size': String(body.length),
    };
    const subtle = (globalThis.crypto || {}).subtle;
    if (subtle) {
      const digest = await subtle.digest('SHA-256', body);
      headers['x-dgo-sha256'] = Array.from(new Uint8Array(digest))
        .map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    return { method, headers, body };
  }
  return {
    method,
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(t.contract && t.contract.action ? { action: t.contract.action } : {}),
  };
}

async function runProbe(onlyKey) {
  let targets = describeEstate({ resolve }).filter((r) => r.configured);
  if (onlyKey) targets = targets.filter((r) => r.key === onlyKey);
  else if (!view.includeWrites) targets = targets.filter((r) => r.contract && r.contract.readOnly === true);
  const rows = [];
  for (const t of targets) {
    const started = Date.now();
    const row = { key: t.key, status: null, ms: null, ok: false, reached: false, note: '', error: '' };
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 30000);
      const res = await fetch(resolve(t.key), Object.assign(await probeRequest(t), { signal: ctl.signal }));
      clearTimeout(timer);
      row.status = res.status; row.ms = Date.now() - started;
      const text = await res.text();
      try { const b = JSON.parse(text); row.reached = true; row.ok = res.ok;
        row.note = 'JSON · keys: ' + (Object.keys(b || {}).slice(0, 6).join(', ') || 'none'); }
      catch { row.note = 'non-JSON body — something other than Power Automate answered'; }
    } catch (e) {
      row.ms = Date.now() - started;
      row.error = e && e.name === 'AbortError' ? 'timed out' : 'blocked or unreachable';
      row.note = 'may be CORS from this page rather than the endpoint — not conclusive';
    }
    rows.push(row);
  }
  return { at: new Date().toISOString(), rows };
}

/* Export the flow from Power Automate (Export → Package (.zip)) and drop the zip here: the console reads its definition
   in this browser, finds the package for the flow, and compares fingerprints step by step. Nothing leaves the page. */
async function unzipEntries(buf) {
  const dv = new DataView(buf);
  let e = buf.byteLength - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('not a zip file');
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const out = {};
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), at = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nl));
    p += 46 + nl + el + cl;
    const start = at + 30 + dv.getUint16(at + 26, true) + dv.getUint16(at + 28, true);
    out[name] = { method, data: new Uint8Array(buf, start, size) };
  }
  return out;
}
async function entryText(x) {
  if (x.method === 0) return new TextDecoder().decode(x.data);
  const stream = new Blob([x.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(stream).text();
}

async function verifyExport(file) {
  try {
    const entries = await unzipEntries(await file.arrayBuffer());
    const defName = Object.keys(entries).find((k) => /\/definition\.json$/.test(k));
    if (!defName) throw new Error('no flow definition in this zip');
    const doc = JSON.parse(await entryText(entries[defName]));
    const def = doc.properties.definition;
    const flowName = doc.properties.displayName || '';
    let mailboxes = [];
    if (entries['manifest.json']) {
      const m = JSON.parse(await entryText(entries['manifest.json']));
      mailboxes = Object.values(m.resources || {}).filter((r) => /\/connections$/.test(r.type || '') && r.details).map((r) => r.details.displayName).filter(Boolean);
    }
    const st = WorkStatus.packages.filter((p) => p.flow === flowName);
    const results = st.map((p) => {
      const print = PackagePrints.find((x) => x.file === p.file);
      const scope = findScope(def, print.root);
      if (!scope) return { p, missingRoot: print.root };
      const got = Object.fromEntries(Object.entries(stepHashes(scope)).map(([n, h]) => [printName(n), h])), fp = scopeFingerprint(scope);
      const onlyExport = Object.keys(got).filter((n) => !(n in print.steps));
      const onlyPackage = Object.keys(print.steps).filter((n) => !(n in got));
      const differ = Object.keys(got).filter((n) => n in print.steps && got[n] !== print.steps[n]);
      const led = WorkStatus.ledger.find((e) => e.file === p.file);
      return { p, fp, same: fp === print.fingerprint, ledger: led ? led.fingerprint === fp : null, onlyExport, onlyPackage, differ, empty: emptySetVariables(scope).map(printName) };
    });
    S.verify = { name: file.name, flowName, mailboxes, results };
  } catch (err) { S.verify = { name: file.name, error: String(err.message || err) }; }
  render();
}

function adoptionOf(workflowId) {
  const flows = WorkStatus.workflowFlows[String(workflowId || '').toLowerCase()] || [];
  for (const id of flows) {
    const a = WorkStatus.adoption.adopted.find((x) => String(x.flowId).toLowerCase() === id);

  return null;
}

    + '<div class="row">' + chipRow('data-work', view.workFilter, [['all', 'All ' + P.length], ['paste', 'To paste ' + n('paste')], ['re-paste', 'To re-paste ' + n('re-paste')], ['in-tenant', 'In the tenant ' + n('in-tenant')]]) + '</div>'
    + '<div class="tablewrap"><table><thead><tr><th>Phase</th><th>Key</th><th>Flow</th><th>Next</th><th>In the tenant</th><th>Mails</th><th>Office 365</th><th>Steps</th></tr></thead><tbody>'
    + rows.map((p) => '<tr><td>' + p.phase + '</td><td><code style="white-space:nowrap;overflow-wrap:normal">' + esc(p.key) + '</code></td><td><a target="_blank" rel="noreferrer" href="' + PA_FLOW + esc(p.flowId) + '/details">' + esc(p.flow) + ' ↗</a><div class="tiny"><code>' + esc(p.file) + '</code></div></td>'
      + '<td>' + pill(ACTION_LABEL[p.action], ACTION_KIND[p.action]) + '</td><td class="tiny">' + esc(p.tenant) + ((p.emptySetVariables || []).length ? '<div class="tiny" style="color:var(--bad)">' + p.emptySetVariables.length + ' Set variable step(s) arrived empty in the tenant</div>' : '') + '</td><td>' + p.sends + '</td>'
      + '<td>' + (p.office365.length ? (p.onRegistryMailbox ? pill('registry mailbox', 'ok') : pill(p.office365.join(', '), 'bad')) : '<span class="tiny">none</span>') + '</td><td>' + p.steps + '</td></tr>').join('')
    + '</tbody></table></div><p class="tiny">' + rows.length + ' of ' + P.length + ' shown.</p></section>'

    + '<section class="panel' + (offMailbox.length ? ' danger' : ' good') + '"><h2>Sending mailbox</h2>'
    + '<p class="muted">Every Office 365 step signs in as <b>' + esc(WorkStatus.mail.mailbox) + '</b> (connection <code>' + esc(WorkStatus.mail.connection.slice(0, 8)) + '…</code>), and administrative mail goes to it. '
    + (offMailbox.length ? offMailbox.length + ' package(s) bind another connection: ' + offMailbox.map((p) => esc(p.flow)).join(', ') + '.' : 'Every package binds it.')
    + ' ' + WorkStatus.mail.messages + ' messages in the e-mail catalogue; each body comes from one template.</p></section>'

    + '<section class="panel"><h2>Open register items</h2>'
    + (WorkStatus.register.open.length
      ? '<div class="tablewrap"><table><thead><tr><th>Item</th><th>Status</th><th>Title</th><th>Why open</th></tr></thead><tbody>'
        + WorkStatus.register.open.map((i) => '<tr><td><code>' + esc(i.id) + '</code></td><td>' + pill(i.status.replace(/_/g, ' ').toLowerCase(), i.status === 'SPECIFIED_NOT_APPLIED' || i.status === 'APPLIED_UNVERIFIED' ? 'info' : 'warn') + '</td><td>' + esc(i.title) + '</td><td class="tiny">' + esc(i.whyOpen) + '</td></tr>').join('')
        + '</tbody></table></div>'
      : '<p class="muted">Nothing open.</p>')
    + '<p class="tiny">From docs/deployment/PRODUCTION_READINESS_REGISTER.json. RESOLVED, ACCEPTED and DISCHARGED_UNTRACKABLE items are closed and not listed.</p></section>'

    + '<section class="panel"><h2>Retired flows</h2>'
    + '<div class="tablewrap"><table><thead><tr><th>Flow</th><th>Why retired</th><th>Successor</th><th>In the tenant</th><th>Delete from</th></tr></thead><tbody>'
    + R.map((r) => '<tr><td>' + esc(r.name) + '<div class="tiny"><code>' + esc(r.flowIdPrefix || '') + '</code></div></td><td class="tiny">' + esc(r.why) + '</td><td class="tiny">' + esc(r.successor || '—') + '</td><td>' + pill(r.tenantState, /^Turned off/i.test(r.tenantState) ? 'ok' : 'warn') + '</td><td>' + esc(r.deleteFrom || '—') + '</td></tr>').join('')
    + '</tbody></table></div>'
    + (WorkStatus.adoption.retiredKeys.length ? '<p class="tiny">Retired contract keys: ' + WorkStatus.adoption.retiredKeys.map((k) => esc(k.key)).join(', ') + '.</p>' : '')
    + '</section>';
}

const TABS = [['overview', 'Overview'], ['work', 'Work status'], ['commission', 'Commission'], ['endpoints', 'Endpoints'],
  ['estate', 'Flow estate'], ['findings', 'Findings'], ['health', 'Health'],
  ['rotation', 'Rotation'], ['compare', 'Compare'], ['export', 'Export'], ['reference', 'Reference']];

function panelFor(tab) {
  switch (tab) {
    case 'work': return workPanel();
    case 'commission': return commissionPanel();
    case 'endpoints': return endpointsPanel();
    case 'estate': return estatePanel();
    case 'findings': return findingsPanel();
    case 'health': return healthPanel();
    case 'rotation': return rotationPanel();
    case 'compare': return comparePanel();
    case 'export': return exportPanel();
    case 'reference': return referencePanel();
    default: return overviewPanel();
  }
}

function render() {
  $('#app').innerHTML = summaryStrip()
    + '<nav class="tabs">' + TABS.map(([v, l]) => '<button data-tab="' + v + '" aria-selected="' + (view.tab === v) + '">' + l + '</button>').join('') + '</nav>'
    + panelFor(view.tab);
  if (location.hash.slice(1) !== view.tab) history.replaceState(null, '', '#' + view.tab);
}

/* ── events ───────────────────────────────────────────────────────────────────────────── */

document.addEventListener('click', async (e) => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const el = t.closest('[data-tab],[data-surface],[data-status],[data-estate],[data-work],[data-sort],[data-key],[data-wf],[data-close],'
    + '[data-pick],[data-pick-baseline],[data-paste-toggle],[data-paste-load],[data-unload],[data-probe],[data-probe-one],'
    + '[data-clear-probe],[data-gen-runtime],[data-gen-portal],[data-gen-both],[data-gen-values],[data-copy-values],'
    + '[data-report],[data-report-copy],[data-csv],[data-print],[data-clear-sigs],[data-clear-sig],[data-clear-baseline],'
    + '[data-compare-csv],[data-probe-csv],[data-rotation-csv],[data-rotation-reset],[data-pick-export]');
  if (!el) return;
  const a = (n) => el.getAttribute(n);

  if (a('data-tab') !== null) { view.tab = a('data-tab'); view.selected = null; view.wf = null; view.q = ''; return render(); }
  if (a('data-surface') !== null) { view.surface = a('data-surface'); return render(); }
  if (a('data-status') !== null) { view.status = a('data-status'); return render(); }
  if (a('data-estate') !== null) { view.estateFilter = a('data-estate'); return render(); }
  if (a('data-work') !== null) { view.workFilter = a('data-work'); return render(); }
  if (a('data-sort') !== null) { const k = a('data-sort'); view.sortDir = view.sortKey === k ? -view.sortDir : 1; view.sortKey = k; return render(); }
  if (a('data-close') !== null) { view.selected = null; view.wf = null; return render(); }
  if (a('data-wf') !== null) { view.wf = a('data-wf'); view.tab = 'estate'; render(); $('[data-detail]') && $('[data-detail]').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  if (a('data-key') !== null) { view.selected = a('data-key'); render(); $('[data-detail]') && $('[data-detail]').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  if (a('data-pick') !== null) { $('[data-file]').click(); return; }
  if (a('data-pick-baseline') !== null) { $('[data-file-baseline]').click(); return; }
  if (a('data-pick-export') !== null) { $('[data-file-export]').click(); return; }
  if (a('data-paste-toggle') !== null) { const p = $('[data-paste]'); p.hidden = !p.hidden; return; }
  if (a('data-paste-load') !== null) { load($('[data-paste-text]').value, 'pasted text'); return; }
  if (a('data-unload') !== null) { S = { urls: {}, sourceName: '', baseline: null, probe: null, rotated: S.rotated, busy: false }; view.selected = null; view.tab = 'overview'; toast('Cleared.'); return render(); }
  if (a('data-clear-baseline') !== null) { S.baseline = null; return render(); }

  if (a('data-clear-sigs') !== null) {
    if (!confirm('Clear every signature entered in this session?\n\nNothing on any server changes. Files you have already downloaded are unaffected.')) return;
    S.urls = {}; S.sourceName = ''; toast('All signatures cleared.'); return render();
  }
  if (a('data-clear-sig') !== null) { applySignature(a('data-clear-sig'), ''); return render(); }

  if (a('data-probe') !== null || a('data-probe-one') !== null) {
    const one = a('data-probe-one');
    if (!one && view.includeWrites) {
      const writes = describeEstate({ resolve }).filter((r) => r.configured && !(r.contract && r.contract.readOnly === true));
      if (writes.length && !confirm('Probe ' + writes.length + ' WRITE endpoint(s)?\n\n'
        + writes.map((r) => r.key).join(', ') + '\n\nThese create real records — correspondence, assignments, emails — in the live registry. Continue?')) return;
    }
    S.busy = true; render();
    try { const res = await runProbe(one); S.probe = one && S.probe ? { at: res.at, rows: S.probe.rows.filter((r) => r.key !== one).concat(res.rows) } : res; }
    finally { S.busy = false; render(); }
    return;
  }
  if (a('data-clear-probe') !== null) { S.probe = null; return render(); }

  if (a('data-gen-runtime') !== null || a('data-gen-both') !== null) {
    download('config.local.js', renderRuntimeConfig(S.urls), 'text/javascript');
    toast('config/config.local.js downloaded. It carries live signatures — never commit it.');
  }
  if (a('data-gen-portal') !== null || a('data-gen-both') !== null) {
    setTimeout(() => download('portal.config.local.js', renderPortalConfig(S.urls), 'text/javascript'), a('data-gen-both') !== null ? 400 : 0);
    if (a('data-gen-both') === null) toast('document-portal/config.local.js downloaded. Rename it to config.local.js.');
    else toast('Both files downloaded. Rename portal.config.local.js to config.local.js in document-portal/.');
  }
  if (a('data-gen-values') !== null) { download('dgo-values.txt', valuesFileText(S.urls)); return; }
  if (a('data-copy-values') !== null) { return copy(valuesFileText(S.urls), 'Values file'); }
  if (a('data-report') !== null) { download('dgo-endpoint-report.json', JSON.stringify(exportReport({ resolve }), null, 2), 'application/json'); return; }
  if (a('data-report-copy') !== null) { return copy(JSON.stringify(exportReport({ resolve }), null, 2), 'Redacted report'); }
  if (a('data-csv') !== null) { download('dgo-endpoints.csv', estateCsv(), 'text/csv'); return; }
  if (a('data-print') !== null) { window.print(); return; }
  if (a('data-probe-csv') !== null && S.probe) {
    download('dgo-probe.csv', csv(['key', 'status', 'ms', 'reached', 'note'], S.probe.rows.map((r) => [r.key, r.status || r.error, r.ms, r.reached, r.note])));
    return;
  }
  if (a('data-rotation-csv') !== null) {
    const seen = new Set(); const rows = [];
    for (const k of EndpointAtlas.keys) {
      if (seen.has(k.workflowId)) continue; seen.add(k.workflowId);
      const ks = EndpointAtlas.keys.filter((x) => x.workflowId === k.workflowId);
      rows.push([k.flow, k.workflowId, ks.map((x) => x.key).join(' '), ks.length, S.rotated[k.workflowId] ? 'yes' : 'no']);
    }
    download('dgo-rotation-plan.csv', csv(['flow', 'workflowId', 'keys', 'keyCount', 'rotated'], rows));
    return;
  }
  if (a('data-rotation-reset') !== null) { S.rotated = {}; return render(); }
  if (a('data-compare-csv') !== null && S.baseline) {
    download('dgo-compare.csv', csv(['key', 'verdict'], EndpointAtlas.keys.map((k) => {
      const x = S.urls[k.key] || '', y = S.baseline.urls[k.key] || '';
      return [k.key, !x && !y ? 'both empty' : !x ? 'only in baseline' : !y ? 'only in current' : x === y ? 'identical' : 'different'];
    })));
    return;
  }
});

/* Signature entry: applied on blur or Enter, not on every keystroke — re-rendering mid-paste
   would steal the caret, and a 43-character value arrives in one paste anyway. */
function commitSignature(input) {
  const wf = input.getAttribute('data-sig');
  const res = applySignature(wf, input.value);
  if (!res.ok) { input.classList.add('bad'); toast(res.why, 'bad'); return; }
  input.value = '';
  render();
  const next = $$('[data-sig]').find((i) => !i.closest('.issue').classList.contains('good'));
  if (next) next.focus();
}

document.addEventListener('keydown', (e) => {
  const sig = e.target.closest && e.target.closest('[data-sig]');
  if (sig && e.key === 'Enter') { e.preventDefault(); commitSignature(sig); }
  if (e.key === 'Escape' && (view.selected || view.wf)) { view.selected = null; view.wf = null; render(); }
});
document.addEventListener('blur', (e) => {
  const sig = e.target.closest && e.target.closest('[data-sig]');
  if (sig && sig.value.trim()) commitSignature(sig);
}, true);

document.addEventListener('input', (e) => {
  const q = e.target.closest('[data-q]');
  if (q) {
    view.q = q.value; const pos = q.selectionStart; render();
    const again = $('[data-q]'); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    return;
  }
  const w = e.target.closest('[data-writes]');
  if (w) { view.includeWrites = w.checked; return; }
  const rot = e.target.closest('[data-rotated]');
  if (rot) { S.rotated[rot.getAttribute('data-rotated')] = rot.checked; render(); }
});

document.addEventListener('change', (e) => {
  const f = e.target.closest('[data-file]');
  if (f && f.files && f.files[0]) { const file = f.files[0]; file.text().then((t) => load(t, file.name)); return; }
  const x = e.target.closest('[data-file-export]');
  if (x && x.files && x.files[0]) { verifyExport(x.files[0]); return; }
  const b = e.target.closest('[data-file-baseline]');
  if (b && b.files && b.files[0]) { const file = b.files[0]; file.text().then((t) => load(t, file.name, true)); }
});

for (const [ev, fn] of [['dragover', (d, e) => { e.preventDefault(); d.classList.add('over'); }],
                        ['dragleave', (d) => d.classList.remove('over')]]) {
  document.addEventListener(ev, (e) => { const d = e.target.closest('[data-drop],[data-drop-baseline],[data-drop-export]'); if (d) fn(d, e); });
}
document.addEventListener('drop', (e) => {
  const d = e.target.closest('[data-drop],[data-drop-baseline],[data-drop-export]');
  if (!d) return;
  e.preventDefault(); d.classList.remove('over');
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (file && d.hasAttribute('data-drop-export')) { verifyExport(file); return; }
  if (file) file.text().then((t) => load(t, file.name, d.hasAttribute('data-drop-baseline')));
});

window.addEventListener('hashchange', () => {
  const t = location.hash.slice(1);
  if (TABS.some(([v]) => v === t) && t !== view.tab) { view.tab = t; render(); }
});

const initial = location.hash.slice(1);
if (TABS.some(([v]) => v === initial)) view.tab = initial;
render();

</script>
</body></html>
