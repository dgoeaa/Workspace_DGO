<!doctype html>
<html lang="en" data-platform="dgo-ops">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05583B">
  <!-- I-17. The shell replaces this with "{Screen} — NITDA Folio" on every route
       change. It previously read "R11.6 Obsidian Harmonized Design System Runtime" and never
       changed, so every tab of the platform was identical and named after a release
       codename and a design-system version rather than the product. -->
  <title>NITDA Folio</title>
  <!-- H-03. The tab icon was a 329-byte placeholder mark while the public portal carried the
       real agency identity, so the two halves of one programme were unrecognisable as the
       same programme in a row of open tabs. This is the portal's own NITDA symbol. -->
  <link rel="icon" href="assets/nitda-symbol.png" type="image/png">
  <!-- Single deterministic @layer entry (see styles/index.css). Replaces 19 unordered links. -->
  <link rel="stylesheet" href="styles/index.css">
  <!-- Runtime config: copy config/config.example.js → config/config.local.js and fill in
       rotated endpoint URLs.  The onerror handler is intentional — the file is optional. -->
  <script src="config/config.local.js" onerror="void 0"></script>
</head>
<body>
<!-- The DGO Digital Ops lockup (internal sub-brand, beside the NITDA logo). Kept current by
     `npm run brand:sync`; core/brand-sub.js clones it wherever the shell draws the brand. -->
<template id="dgo-sub-tpl"><span class="bk-sub bk-sub--reverse" data-bk-sub><span class="bk-sub__word" aria-hidden="true">DG<svg class="bk-sub__o" viewBox="0 0 56 56" aria-hidden="true" focusable="false"><circle class="ring" cx="28" cy="28" r="20"/><circle class="dot" cx="28" cy="28" r="6.5"/></svg></span><span class="bk-sub__name" aria-hidden="true"><span>Digital</span><span>Ops</span></span><span class="bk-sub__sr">DGO Digital Ops</span><!--/bk-sub--></span></template>
  <a class="skip" href="#main">Skip to main content</a>
  <!-- I-15. This was unstyled left-aligned body text on a white page, with the 15-second
       watchdog below as the only other feedback — fifteen seconds of an apparently blank
       page reads as a broken link. It now shows the brand mark, an indeterminate progress
       indicator, and a "still loading" line that appears at 5 seconds. -->
  <div id="app"><div class="boot" role="status" aria-live="polite">
    <img class="boot__mark" src="assets/nitda-lockup-white.png" alt="National Information Technology Development Agency" width="544" height="254">
    <p class="boot__title">NITDA Folio</p>
    <div class="boot__bar" aria-hidden="true"><i></i></div>
    <p class="boot__note">Starting your governed workspace…</p>
    <p class="boot__slow" id="bootSlow" hidden>Still loading. This is taking longer than usual.</p>
  </div></div>
  <noscript><div class="fatal">JavaScript is required to run NITDA Folio.</div></noscript>
  <script type="module" src="shared/figma-uiux-runtime.js"></script>
  <script type="module" src="core/boot.js"></script>
  <!-- Boot watchdog. core/boot.js has its own try/catch, but it cannot catch a failure to
       RESOLVE the static module graph: that happens before boot() is ever invoked, so no
       catch runs, no pageerror fires, and the spinner above stays up forever — visually
       indistinguishable from a slow network. That is exactly how 12 missing config modules
       shipped unnoticed. Record module load failures and surface them if boot never lands. -->
  <script>
    (function () {
      var failed = [];
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el !== window && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
          var src = el.src || el.href || '';
          if (src && failed.indexOf(src) === -1) failed.push(src);
        }
      }, true);
      /* Sign-in waits on the person, not on the network, so the watchdog's 15 seconds do not
         run while the sign-in dialog is open; they start again once it closes (core/boot.js). */
      var LIMIT = 15000;
      var watch = function () {
        if (window.__DGO_BOOTED__) return;
        if (window.__DGO_SIGNING_IN__) { setTimeout(watch, 1000); return; }
        var since = window.__DGO_SIGNED_IN_AT__;
        if (since && Date.now() - since < LIMIT) { setTimeout(watch, LIMIT - (Date.now() - since)); return; }
        var host = document.getElementById('app');
        if (!host || !host.querySelector('.boot')) return;
        var esc = function (s) {
          return String(s).replace(/[&<>]/g, function (m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
          });
        };
        /* I-06. The screen a user sees when the platform is down used to speak only to a
           developer: ES module resolution, file:// versus HTTP, directory names. An
           operator can act on none of it. The plain notice and the retry come first; the
           diagnostic text is still here, in full, behind a disclosure for IT support. */
        var detail = failed.length
          ? '<p>The following resources failed to load:</p><ul>' +
            failed.map(function (u) { return '<li><code>' + esc(u) + '</code></li>'; }).join('') +
            '</ul>'
          : '<p>No failing resource was reported. Check the browser console and the network ' +
            'panel — an ES module in the graph most likely failed to resolve.</p>';
        host.innerHTML =
          '<div class="fatal">' +
          '<h1>NITDA Folio could not start</h1>' +
          '<p>The workspace did not finish loading. This is usually temporary.</p>' +
          '<p><button type="button" class="fatal__retry" onclick="location.reload()">Try again</button></p>' +
          '<p>If it happens again, contact IT support and tell them the time you saw this ' +
          'message.</p>' +
          '<details class="fatal__tech"><summary>Technical details (for IT support)</summary>' +
          '<p>The runtime did not finish booting within 15 seconds.</p>' + detail +
          '<p>Serve the app over HTTP (not <code>file://</code>) and confirm every module ' +
          'under <code>config/</code>, <code>core/</code>, <code>modules/</code> and ' +
          '<code>shared/</code> is present.</p></details></div>';
      };
      setTimeout(watch, LIMIT);
      /* I-15 — surface a "still loading" line well before the watchdog fires. */
      setTimeout(function () {
        if (window.__DGO_BOOTED__) return;
        var slow = document.getElementById('bootSlow');
        if (slow) slow.hidden = false;
      }, 5000);
    })();
  </script>
</body>
</html>
